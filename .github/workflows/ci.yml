name: CI

on:
  push:
    branches: [master]
  pull_request:

# 同一分支只保留最新一次运行，推得快时不排队浪费。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web（typecheck / lint / test / build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: 安装依赖
        run: bun install --cwd apps/web --frozen-lockfile
      - name: 准备本地配置
        run: cp apps/web/.env.example apps/web/.env.local
      - run: bun run typecheck
      - run: bun run typecheck:api-strict
      - run: bun run lint
      - run: bun run test:coverage
      - run: bun run audit:web
      - run: bun run build
      - run: bun run check:bundle

  api:
    name: API（build / vet / test）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: go build ./...
      - run: go vet ./...
      # 需要真实数据库的集成测试默认跳过，CI 不注入对应环境变量。
      - run: go test ./...
      - run: go test -race ./...
      - name: Go 依赖漏洞扫描
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: 检查 gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未经 gofmt 格式化："
            echo "$unformatted"
            exit 1
          fi

  hygiene:
    name: 模块行数
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-file-size.sh
      - run: ./scripts/check-go-request-context.sh
