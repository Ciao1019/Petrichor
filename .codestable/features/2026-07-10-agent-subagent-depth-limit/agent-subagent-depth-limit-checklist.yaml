feature: 2026-07-10-agent-subagent-depth-limit
created: 2026-07-10

steps:
  - action: "depth/maxDepth 解析 + filter allowRespawn + ctx 传递"
    exit_signal: "单测覆盖默认/再委派/越界/夹紧"
    status: done
  - action: "提示词与架构一句"
    exit_signal: "系统提示提及有限再委派；架构已更新"
    status: done
  - action: "提交 push"
    exit_signal: "已 push"
    status: done

checks:
  - item: "默认 maxDepth=1，硬上限 2"
    source: 名词契约
    status: done
  - item: "depth<maxDepth 才装载再 spawn"
    source: 编排骨架
    status: done
  - item: "越界 soft-fail subagent_depth_exceeded"
    source: 流程级约束
    status: done
  - item: "不做写子代理/fanout"
    source: 范围守护
    status: done
  - item: "验收 1–5"
    source: 验收场景
    status: done
