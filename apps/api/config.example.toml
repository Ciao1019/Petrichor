[server]
environment = "development"
host = "0.0.0.0"
port = 8080
base_url = "http://localhost:3000"
# 只信任实际位于 API 前方的反向代理；禁止无条件配置 0.0.0.0/0。
trusted_proxies = ["127.0.0.1/32", "::1/128", "172.30.0.0/24"]
read_header_timeout_seconds = 10
read_timeout_seconds = 30
# SSE/Agent 流式响应由业务超时控制，0 表示不设置全局 WriteTimeout。
write_timeout_seconds = 0
idle_timeout_seconds = 120
shutdown_timeout_seconds = 30
max_json_body_bytes = 4194304
max_upload_bytes = 134217728

[database]
url = "postgres://postgres:password@127.0.0.1:5432/postgres"
# 可选：迁移专用连接；留空时回退到 url。
migration_url = ""
max_conns = 10
min_conns = 2
max_conn_lifetime_seconds = 1800
max_conn_idle_time_seconds = 300
health_check_period_seconds = 60

# 单 API 实例的知识构建内存队列。文章和阶段任务池共享全局模型信号量，
# 默认最多同时执行 8 篇文章、发出 64 个模型请求。
[knowledge_build]
concurrency = 8
queue_size = 128
question_batch_concurrency = 8
page_batch_concurrency = 8
model_concurrency = 64

[auth]
session_expire_seconds = 172800
register_enabled = false
default_system_role = "USER"

[auth.linuxdo]
client_id = ""
client_secret = ""
redirect_uri = ""

[auth.local_development]
enabled = false
user_id = 0

[encryption]
# 生产环境必须替换；可分别用 `openssl rand -base64 32` 与 `openssl rand -hex 16` 生成。
key = "replace-with-a-stable-random-secret-of-at-least-32-chars"
salt = "00000000000000000000000000000000"

[storage]
local_directory = ""

[storage.s3]
endpoint = ""
region = "us-east-1"
access_key_id = ""
secret_access_key = ""
bucket = ""
upload_expire_seconds = 900
download_expire_seconds = 3600
use_ssl = true

# Docker Compose 使用服务名 redis；本机直接运行 Go 时改为 127.0.0.1。
[cache.redis]
url = "redis://redis:6379/0"
pool_size = 32
min_idle_conns = 4
dial_timeout_ms = 2000
read_timeout_ms = 1000
write_timeout_ms = 1000

[agent]
skills_directory = ""

[agent.features]
soft_router = true
dynamic_skills = true
delegation = true
debug = false

[agent.budget]
max_execution_ms = 0
max_tokens = 0
max_delegation_depth = 2
max_no_progress = 3
tool_timeout_ms = 45000
tool_max_retries = 1
subagent_timeout_ms = 120000
context_tokens = 100000

[agent.budget.direct]
max_iterations = 1
max_tool_calls = 0
max_subagents = 0

[agent.budget.simple]
max_iterations = 4
max_tool_calls = 4
max_subagents = 0

[agent.budget.multi_step]
max_iterations = 12
max_tool_calls = 14
max_subagents = 2

[agent.budget.complex]
max_iterations = 24
max_tool_calls = 32
max_subagents = 5

# 可选外部搜索：tavily / serper / brave / searxng。网页抓取无需配置。
[agent.research]
provider = ""
api_key = ""
base_url = ""
timeout_ms = 12000
