[server]
environment = "development"
host = "0.0.0.0"
port = 8080
base_url = "http://localhost:3000"
# 只信任实际位于 API 前方的反向代理；禁止无条件配置 0.0.0.0/0。
trusted_proxies = ["127.0.0.1/32", "::1/128", "172.30.0.0/24"]
read_header_timeout_seconds = 10
read_timeout_seconds = 30
# SSE/Agent 流式响应由业务超时控制，0 表示不设置全局 WriteTimeout。
write_timeout_seconds = 0
idle_timeout_seconds = 120
shutdown_timeout_seconds = 30
max_json_body_bytes = 4194304
max_upload_bytes = 134217728

[database]
url = "postgres://postgres:password@127.0.0.1:5432/postgres"
# 可选：迁移专用连接；留空时回退到 url。
migration_url = ""
max_conns = 10
min_conns = 2
max_conn_lifetime_seconds = 1800
max_conn_idle_time_seconds = 300
health_check_period_seconds = 60

# Asynq 知识构建队列。queue_size 是 Redis 待处理任务的软上限；Worker 默认最多
# 同时执行 8 篇文章，文章和阶段任务池共享 64 路全局模型信号量。
[knowledge_build]
concurrency = 8
queue_size = 128
question_batch_concurrency = 8
page_batch_concurrency = 8
model_concurrency = 64

# 服务端原件解析命令（不通过 shell 执行），超时覆盖解析与逐页渲染/上传。
[document_import.parser]
command = "petrichor-doc-convert"
timeout_seconds = 300

[auth]
session_expire_seconds = 172800
register_enabled = false
default_system_role = "USER"

[auth.linuxdo]
# Go 只读取本节，不读取 LINUX_DO_* 环境变量；启用登录/绑定必须同时填写这两项。
client_id = ""
client_secret = ""
# 留空时使用 server.base_url + /api/auth/callback，必须与 LinuxDo Connect 登记的回调一致。
redirect_uri = ""
# 授权页：https://connect.linux.do/oauth2/authorize
# 换取令牌：https://connect.linuxdo.org/oauth2/token
# 用户信息：https://connect.linuxdo.org/api/user

[auth.local_development]
enabled = false
user_id = 0

[encryption]
# 生产环境必须替换；可分别用 `openssl rand -base64 32` 与 `openssl rand -hex 16` 生成。
key = "replace-with-a-stable-random-secret-of-at-least-32-chars"
salt = "00000000000000000000000000000000"

[storage]
local_directory = ""

[storage.s3]
endpoint = ""
region = "us-east-1"
access_key_id = ""
secret_access_key = ""
bucket = ""
upload_expire_seconds = 900
download_expire_seconds = 3600
use_ssl = true

# 缓存与 Asynq 共用这套 Redis 连接参数；任务队列不支持进程内降级。
# Docker Compose 使用服务名 redis；本机直接运行 Go 时改为 127.0.0.1。
[cache.redis]
url = "redis://redis:6379/0"
pool_size = 32
min_idle_conns = 4
dial_timeout_ms = 2000
read_timeout_ms = 1000
write_timeout_ms = 1000

[agent]
# 相对 config.toml；镜像内示例目录为 /app/agent-skills。修改后重启 API/Worker。
skills_directory = ""

[agent.pi]
# API 与 Worker 共用 Pi Agent Core。镜像自带 Bun 和打包入口。
# 本地先执行 bun run install:agent；留空 entry 自动查找源码或镜像内入口。
command = "bun"
entry = ""

# 外部 MCP 使用 Streamable HTTP；URL 和 token 只留在 Go，默认仅操作员可用。
# 浏览器完整示例见 docs/agent/extensions.md；没有通配符授权。
# [[agent.integrations.mcp]]
# name = "browser"
# url = "http://127.0.0.1:8931/mcp"
# token = ""
# read_tools = ["browser_snapshot"]
# write_tools = ["browser_navigate", "browser_click", "browser_type", "browser_press_key", "browser_tabs", "browser_close"]
# allow_users = false
# timeout_seconds = 30

[agent.integrations.rerank]
enabled = false
# 完整 endpoint；支持 Jina /v1/rerank 兼容协议。发送已授权候选的截断正文。
url = "https://api.jina.ai/v1/rerank"
api_key = ""
model = "jina-reranker-v2-base-multilingual"
timeout_seconds = 8

[agent.integrations.sandbox]
enabled = false
# 独立沙箱主机的 /execute 地址；不要把 Docker socket 挂入 API/Worker。
url = "http://127.0.0.1:8099/execute"
token = ""
timeout_seconds = 20
allow_users = false

[agent.features]
soft_router = true
dynamic_skills = true
delegation = true
debug = false

[agent.budget]
max_execution_ms = 0
max_tokens = 0
max_delegation_depth = 2
max_no_progress = 3
tool_timeout_ms = 45000
tool_max_retries = 1
subagent_timeout_ms = 120000
context_tokens = 100000

[agent.budget.direct]
max_iterations = 1
max_tool_calls = 0
max_subagents = 0

[agent.budget.simple]
max_iterations = 4
max_tool_calls = 4
max_subagents = 0

[agent.budget.multi_step]
max_iterations = 12
max_tool_calls = 14
max_subagents = 2

[agent.budget.complex]
max_iterations = 24
max_tool_calls = 32
max_subagents = 5

# 可选外部搜索：tavily / serper / brave / searxng。网页抓取无需配置。
[agent.research]
provider = ""
api_key = ""
base_url = ""
timeout_ms = 12000

# Jev 随笔归档推荐。仅用户点击「智能推荐」时调用；密钥只在 Go API 服务端使用。
# 英文训练为主，中文需验证；阈值是起点，不代表正确率保证。
[typesafe]
enabled = false
base_url = "https://api.typesafe.ai"
api_key = ""
model = "jev-1.13.0"
timeout_seconds = 20
min_confidence = 0.7
tag_threshold = 0.85

# 随笔网页采集：API 与 Worker 必须使用相同配置。密钥仅保存在服务端。
# 自托管可改 base_url；按实际部署确认 screenshot / actions / ai_formats。
[firecrawl]
enabled = false
base_url = "https://api.firecrawl.dev"
api_key = ""
screenshot = true
actions = true
ai_formats = true
timeout_seconds = 120
concurrency = 4
per_user_concurrency = 2
daily_limit = 50
max_batch = 10
